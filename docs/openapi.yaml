openapi: 3.1.0
info:
  title: InsightFlare API
  description: Privacy-focused web analytics API. API v1 endpoints use an API key
    passed as a Bearer token in the Authorization header. All timestamps in
    typed API v1 query bodies and response objects are ISO 8601 date-time
    strings unless the field name explicitly ends with `Ms`. Fields ending with
    `Ms` represent millisecond values, such as durations or Unix timestamps
    depending on context. Analytics ranges use [from, to) semantics.
  version: 0.7.1
  contact:
    name: InsightFlare
    url: https://github.com/ravelloh/InsightFlare
  license:
    name: MIT
    url: https://github.com/ravelloh/InsightFlare/blob/main/LICENSE
externalDocs:
  description: InsightFlare API documentation
  url: https://insight.ravelloh.com/docs
servers:
  - url: https://insight.ravelloh.com
    description: Production
security:
  - BearerAuth: []
tags:
  - name: Discovery
    description: API discovery and capabilities
  - name: Token
    description: Token introspection
  - name: Team
    description: Current team resources
  - name: Sites
    description: Site resources
  - name: Settings
    description: Tracking, privacy, and sharing settings
  - name: Analytics
    description: Analytics data primitives
  - name: Events
    description: Event resources
  - name: Visitors
    description: Visitor resources
  - name: Sessions
    description: Session resources
  - name: Funnels
    description: Funnel resources and analysis
  - name: Performance
    description: Core Web Vitals performance data
  - name: Realtime
    description: Realtime activity
  - name: Batch
    description: Global batch requests
  - name: Health
    description: Health checks
  - name: Ingestion
    description: Browser event ingestion
paths:
