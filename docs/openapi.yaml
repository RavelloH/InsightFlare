                                /content/application~1json/schema/$defs/__schem\
                                a0"
                          required:
                            - type
                            - expression
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              const: dsl
                            expression:
                              type: string
                              minLength: 1
                              maxLength: 65536
                          required:
                            - type
                            - expression
                          additionalProperties: false
                        - type: object
                          properties:
                            type:
                              type: string
                              const: saved
                            id:
                              type: string
                              minLength: 1
                              maxLength: 256
                          required:
