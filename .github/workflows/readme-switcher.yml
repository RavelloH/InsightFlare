name: README i18n switcher

on:
  workflow_call:

permissions:
  contents: read

jobs:
  switcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: switcher
        uses: n9gc/auto-readme-i18n-switcher@v2.0.1
        with:
          folders: |
            .github/readme
          repoReadme: ".github/readme/README.en.md"
          switcherBody: "\n| {{lines}} |\n"
      - name: Require committed README switcher updates
        run: git diff --exit-code -- README.md .github/readme
