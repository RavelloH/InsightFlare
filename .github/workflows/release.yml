name: Release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish verified release
    if: github.repository == 'RavelloH/InsightFlare' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify exact version and publish without modifying main
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "changelog/$VERSION.md"
          [[ "v$(node -p 'require("./package.json").version')" == "$VERSION" ]]
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION"
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Release $VERSION" --notes-file "changelog/$VERSION.md"
