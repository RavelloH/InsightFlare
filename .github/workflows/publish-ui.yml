name: Publish InsightFlare UI

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-ui:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @insightflare/ui typecheck
      - run: pnpm --filter @insightflare/ui build
      - name: Publish public UI package
        run: |
          npm install -g npm@^11.6.0
          cd packages/ui
          npm publish --access public
