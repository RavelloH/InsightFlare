name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional existing changelog version to publish
        type: string
        required: false

permissions:
  contents: read

env:
  CI: true
  HUSKY: "0"

# Cancel obsolete PR validation, never an active main publication.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check every introduced commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            node scripts/check-repository-policy.mjs --range "$PR_BASE" "$PR_HEAD"
            node scripts/check-repository-policy.mjs --commit HEAD
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            node scripts/check-repository-policy.mjs --range "$PUSH_BEFORE" HEAD
          else
            node scripts/check-repository-policy.mjs --commit HEAD
          fi

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full typed lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run lint

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Architecture
        run: pnpm run check:architecture
      - name: Layer contract
        run: pnpm run check:layer
      - name: UI contracts
        run: pnpm run check:ui-contracts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck application and build packages
        run: pnpm run typecheck
      - name: Typecheck package tests
        run: pnpm run typecheck:packages

  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check translations
        run: pnpm run check:i18n

  spec:
    name: OpenAPI and Skills
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI and Skills
        run: pnpm run check:openapi

  schema:
    name: Schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify schema
        run: pnpm run check:schema

  labels:
    name: Labels
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify product labels
        run: pnpm run check:labels

  core-shards:
    name: Core tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run coverage shard
        # Thresholds apply to the merged coverage map, not an individual shard.
        run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=blob --reporter=default --coverage --silent=passed-only
          --coverage.reporter=json-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0 --coverage.thresholds.functions=0
      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: core-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  core-coverage:
    name: Core coverage
    needs: [core-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: core-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Verify all four reports exist
        shell: bash
        run: |
          set -euo pipefail
          for shard in 1 2 3 4; do test -s ".vitest-reports/blob-$shard-4.json"; done
          test "$(find .vitest-reports -maxdepth 1 -type f | wc -l)" -eq 4
      - name: Merge coverage and enforce global thresholds
        run: pnpm exec vitest --merge-reports --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html --coverage.reportsDirectory=coverage/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/core
          if-no-files-found: warn

  tracker:
    name: Tracker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tracker coverage
        run: pnpm run test:coverage:tracker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-tracker-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/tracker
          if-no-files-found: warn

  demo:
    name: Demo build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Demo
        run: pnpm run build:demo

  ui-packages:
    name: UI package audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build UI packages
        run: pnpm run build:packages
      - name: Audit package archives
        run: node scripts/publish-ui-packages.mjs --audit

  deploy-artifact:
    name: Deploy artifact
    uses: ./.github/workflows/build-deploy-artifact.yml

  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      readme: ${{ steps.plan.outputs.readme }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/ci-release-plan.mjs

  release-e2e:
    name: Release E2E
    needs: [release-plan]
    if: needs.release-plan.outputs.version != ''
    uses: ./.github/workflows/e2e.yml

  readme:
    name: README consistency
    needs: [release-plan]
    if: needs.release-plan.outputs.readme == 'true'
    uses: ./.github/workflows/readme-switcher.yml

  gate:
    name: CI Gate
    if: always()
    needs: [policy, format, lint, contracts, typecheck, translations, spec, schema, labels, core-shards, core-coverage, tracker, demo, deploy-artifact, ui-packages, release-plan, release-e2e, readme]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory result
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          const release = results["release-plan"];
          for (const [name, value] of Object.entries(results)) {
            const optional = release.result === "success" && ((name === "release-e2e" && !release.outputs.version) || (name === "readme" && release.outputs.readme !== "true"));
            if (value.result !== (optional ? "skipped" : "success")) {
              console.error(name + ": " + value.result);
              process.exitCode = 1;
            }
          }
          NODE

  publish-nightly:
    name: Publish Nightly
    needs: [gate, deploy-artifact]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.deploy-artifact.result == 'success' &&
      github.repository == 'RavelloH/InsightFlare' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-nightly-artifact.yml

  publish-release:
    name: Publish Release
    needs: [gate, release-plan]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.release-plan.result == 'success' && needs.release-plan.outputs.version != '' &&
      github.repository == 'RavelloH/InsightFlare' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-plan.outputs.version }}
