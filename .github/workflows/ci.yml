name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional existing changelog version to publish
        type: string
        required: false

permissions:
  contents: read

env:
  CI: true
  HUSKY: "0"

# Cancel obsolete PR validation, never an active main publication.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore content-addressed formatting cache
        id: format-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/prettier
          key: prettier-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'packages/*/package.json', 'prettier.config.js', '.prettierignore', '.gitignore', '.editorconfig') }}-${{ github.sha }}
          restore-keys: prettier-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'packages/*/package.json', 'prettier.config.js', '.prettierignore', '.gitignore', '.editorconfig') }}-
      - name: Check formatting
        run: pnpm run format:check
      - name: Save formatting cache from verified formatting on main
        if: success() && steps.format-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .cache/prettier
          key: prettier-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'packages/*/package.json', 'prettier.config.js', '.prettierignore', '.gitignore', '.editorconfig') }}-${{ github.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full typed lint
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        # Typed lint depends on other files and their types. Never reuse per-file results across CI snapshots.
        # Two lint threads were slower on the hosted 4-core runner and duplicated TypeScript programs.
        run: /usr/bin/time -v pnpm exec eslint --no-cache --concurrency off --max-warnings 0 .

  contracts:
    name: Contracts and generated specifications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Architecture
        run: pnpm run check:architecture
      - name: Layer contract
        if: ${{ !cancelled() }}
        run: pnpm run check:layer
      - name: UI contracts
        if: ${{ !cancelled() }}
        run: pnpm run check:ui-contracts
      - name: Verify OpenAPI and Skills
        if: ${{ !cancelled() }}
        run: pnpm run check:openapi
      - name: Verify schema
        if: ${{ !cancelled() }}
        run: pnpm run check:schema
      - name: Verify product labels
        if: ${{ !cancelled() }}
        run: pnpm run check:labels

  typecheck:
    name: Typecheck and UI package audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build UI packages once
        id: packages
        run: pnpm run build:packages
      - name: Typecheck application
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Typecheck package tests
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: pnpm run typecheck:packages
      - name: Audit package archives
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: node scripts/publish-ui-packages.mjs --audit

  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check translations
        run: pnpm run check:i18n

  core-shards:
    env:
      INSIGHTFLARE_CI_BALANCED_SHARDS: "1"
    name: Core tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner resources and worker budget
        run: |
          node -e 'const os=require("node:os"); console.log(JSON.stringify({availableParallelism:os.availableParallelism(),logicalCPUs:os.cpus().length,memoryGiB:os.totalmem()/2**30,sqlite:process.versions.sqlite}))'
          free -h
      - name: Run coverage shard
        # Thresholds apply to the merged coverage map, not an individual shard.
        run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/6 --reporter=blob --reporter=default --coverage --silent=passed-only --maxWorkers=100%
          --coverage.reporter=json-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0 --coverage.thresholds.functions=0
      - name: Upload shard report
        uses: actions/upload-artifact@v4
        with:
          name: core-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  core-coverage:
    name: Core coverage
    needs: [core-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Native merge loads its config and regenerates messages; it does not run tests or the tracker SDK.
      INSIGHTFLARE_CI_PREPARE: skip
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: core-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Verify all six reports exist
        shell: bash
        run: |
          set -euo pipefail
          for shard in 1 2 3 4 5 6; do test -s ".vitest-reports/blob-$shard-6.json"; done
          test "$(find .vitest-reports -maxdepth 1 -type f | wc -l)" -eq 6
      - name: Merge coverage and enforce global thresholds
        run: pnpm exec vitest --merge-reports --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --coverage.reporter=html --coverage.reportsDirectory=coverage/core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/core
          if-no-files-found: warn

  tracker:
    name: Tracker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tracker coverage
        run: pnpm run test:coverage:tracker --maxWorkers=100%
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-tracker-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/tracker
          if-no-files-found: warn

  demo:
    name: Demo build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Demo
        run: pnpm run build:demo

  deploy-artifact:
    name: Deploy artifact
    uses: ./.github/workflows/build-deploy-artifact.yml

  release-plan:
    name: Repository policy and release plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      readme: ${{ steps.plan.outputs.readme }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check every introduced commit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            node scripts/check-repository-policy.mjs --range "$PR_BASE" "$PR_HEAD"
            node scripts/check-repository-policy.mjs --commit HEAD
          elif [[ -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            node scripts/check-repository-policy.mjs --range "$PUSH_BEFORE" HEAD
          else
            node scripts/check-repository-policy.mjs --commit HEAD
          fi
      - id: plan
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: node scripts/ci-release-plan.mjs

  release-e2e:
    name: Release E2E
    needs: [release-plan]
    if: needs.release-plan.outputs.version != ''
    uses: ./.github/workflows/e2e.yml

  readme:
    name: README consistency
    needs: [release-plan]
    if: needs.release-plan.outputs.readme == 'true'
    uses: ./.github/workflows/readme-switcher.yml

  gate:
    name: CI Gate
    if: always()
    needs: [format, lint, contracts, typecheck, translations, core-shards, core-coverage, tracker, demo, deploy-artifact, release-plan, release-e2e, readme]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory result
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const results = JSON.parse(process.env.RESULTS);
          const summary = ["## CI Gate", "", "| Check | Result |", "| --- | --- |"];
          const release = results["release-plan"];
          for (const [name, value] of Object.entries(results)) {
            const optional = release.result === "success" && ((name === "release-e2e" && !release.outputs.version) || (name === "readme" && release.outputs.readme !== "true"));
            const expected = optional ? "skipped" : "success";
            summary.push("| " + name + " | " + value.result + (optional ? " (optional)" : "") + " |");
            if (value.result !== expected) {
              console.error(name + ": " + value.result);
              process.exitCode = 1;
            }
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          NODE

  publish-nightly:
    name: Publish Nightly
    needs: [gate, deploy-artifact]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.deploy-artifact.result == 'success' &&
      github.repository == 'RavelloH/InsightFlare' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-nightly-artifact.yml

  publish-release:
    name: Publish Release
    needs: [gate, release-plan]
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      needs.release-plan.result == 'success' && needs.release-plan.outputs.version != '' &&
      github.repository == 'RavelloH/InsightFlare' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-plan.outputs.version }}
