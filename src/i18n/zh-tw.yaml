    testDescription: 輸入請求值以測試當前卡片中的規則，未儲存的編輯內容也會參與測試。
    testRun: 執行測試
    testClose: 關閉
    testInvalidRules: 請先修復無效規則，然後再進行測試。
    testInvalidRule: 無效規則。
    testBlocked: 已遮蔽
    testAllowed: 已允許
    testNoMatch: 沒有規則匹配，此欄位允許該值通過。
    testMatchedRules: 匹配的規則
    testActionBlock: 遮蔽
    testActionAllow: 允許
    testLine: 第
  blockingRulesFields:
    domains:
      title: 域名
      label: 域名規則（每行一條）
      placeholder: |
        *
        -example.com
        -*.example.com
        admin.example.com
      hint: 匹配頁面 hostname；使用 * 和 -域名 可以實現白名單。
      syntax: |
        每行格式：[ - ] hostname-glob
        以 # 開頭的行將被視為註釋並忽略。
        使用 * 作為萬用字元；以 - 開頭表示允許規則。
        匹配不區分大小寫，並使用頁面 hostname。
      examples:
        - "*"
        - "-example.com"
        - "-*.example.com"
        - "admin.example.com"
      exampleDescription: 這段設定先遮蔽所有域名，再允許 example.com 及其子域名，最後重新遮蔽精確匹配的 admin.example.com。
      testLabel: 主機名
      testPlaceholder: www.example.com
      testHint: 輸入頁面 hostname，不要包含協議或路徑。
    paths:
      title: 路徑
      label: 路徑規則（每行一條）
      placeholder: |
        /admin/*
        /checkout/*/confirm
        -/admin/health
      hint: 使用 glob 語法匹配規範化後的 URL 路徑。
      syntax: |
        每行格式：[ - ] /path-glob
        以 # 開頭的行將被視為註釋並忽略。
        路徑必須以 / 開頭，* 可以匹配任意字元。
        URL 路徑規範化後按區分大小寫的方式匹配。
      examples:
        - "/admin/*"
        - "/checkout/*/confirm"
        - "-/admin/health"
      exampleDescription: 這段設定遮蔽 /admin/ 下的路徑和符合 /checkout/*/confirm 的路徑，但允許 /admin/health。
      testLabel: URL 路徑
      testPlaceholder: /admin/settings
      testHint: 只輸入 pathname，並保留開頭的斜槓。
    queryParameters:
      title: 查詢引數
      label: 查詢引數規則（每行一條）
      placeholder: |
        utm_*
        utm_source=*
        -utm_source=trusted
      hint: 支援 key 或 key=value，鍵和值都支援 * 萬用字元。
      syntax: |
        每行格式：[ - ] key-glob[=value-glob]
        以 # 開頭的行將被視為註釋並忽略。
        省略 = 時，表示匹配該鍵的任意值。
        區分大小寫，鍵和值都支援 * 萬用字元。
      examples:
        - "utm_*"
        - "utm_source=*"
        - "-utm_source=trusted"
      exampleDescription: 這段設定遮蔽所有以 utm_ 開頭的引數以及 utm_source 的任意值，但允許 utm_source=trusted。
      testLabel: 查詢字串
      testPlaceholder: utm_source=internal&utm_campaign=spring
      testHint: 輸入查詢字串，可帶或不帶開頭的 ?。
    referrers:
      title: 來源
      label: 來源規則（每行一條）
      placeholder: |
        *.example.com
        social.example.com
        -trusted.example.com
      hint: 匹配來源頁面的 hostname。
      syntax: |
        每行格式：[ - ] hostname-glob
        以 # 開頭的行將被視為註釋並忽略。
        URL 會先轉換為 hostname，然後再進行匹配。
        匹配不區分大小寫，並支援 * 萬用字元。
      examples:
        - "*.example.com"
        - "social.example.com"
        - "-trusted.example.com"
      exampleDescription: 這段設定遮蔽 example.com 的來源域名和 social.example.com，但允許 trusted.example.com。
      testLabel: 來源
      testPlaceholder: https://social.example.com/article
      testHint: 輸入來源 URL 或 hostname。
    userAgents:
      title: User-Agent
      label: User-Agent 規則（每行一條）
      placeholder: |
        *bot*
        Mozilla/*
        -Googlebot
      hint: 不區分大小寫地使用 glob 語法匹配請求 User-Agent。
      syntax: |
        每行格式：[ - ] text-glob
        以 # 開頭的行將被視為註釋並忽略。
        * 可以匹配請求 User-Agent 中的任意字元。
        匹配不區分大小寫。
      examples:
        - "*bot*"
        - "Mozilla/*"
        - "-Googlebot"
      exampleDescription: 這段設定遮蔽包含 bot 的 User-Agent 和以 Mozilla/ 開頭的值，但允許 Googlebot。
      testLabel: User-Agent
      testPlaceholder: Mozilla/5.0 (compatible; ExampleBot/1.0)
      testHint: 輸入完整或部分請求 User-Agent。
    ips:
      title: IP 地址
      label: IP 規則（每行一條）
      placeholder: |
        203.0.113.15
        2001:db8::1
        203.0.113.0/24
        2001:db8::/32
        -203.0.113.10..203.0.113.20
      hint: 支援 IPv4/IPv6、CIDR 網段以及起始..結束範圍。
      syntax: |
        每行格式：[ - ] address | CIDR | start..end
        以 # 開頭的行將被視為註釋並忽略。
        支援 IPv4 和 IPv6 地址。
        範圍兩端必須使用相同地址族，且起點不能大於終點。
      examples:
        - "203.0.113.15"
        - "2001:db8::1"
        - "203.0.113.0/24"
        - "2001:db8::/32"
        - "-203.0.113.10..203.0.113.20"
      exampleDescription: 這段設定演示 IPv4/IPv6 單個地址、CIDR 網段和 start..end 範圍；範圍前的 - 表示允許該範圍。
      testLabel: IP 地址
      testPlaceholder: 203.0.113.15
      testHint: 輸入一個 IPv4 或 IPv6 地址進行測試。
    asns:
      title: ASN
      label: ASN 規則（每行一條）
      placeholder: |
        64500
        *
        -64501
      hint: 匹配 Cloudflare metadata 中的數字自治系統編號。
      syntax: |
        每行格式：[ - ] ASN-number
        以 # 開頭的行將被視為註釋並忽略。
        使用 * 匹配任意 ASN。
        測試 metadata 值時也接受可選的 AS 字首。
      examples:
        - "64500"
        - "*"
        - "-64501"
      exampleDescription: 這段設定遮蔽 ASN 64500 和任意 ASN，但通過最後一條規則允許 ASN 64501。
      testLabel: ASN
      testPlaceholder: "64500"
      testHint: 輸入數字自治系統編號。
    countries:
      title: 國家 / 地區
      label: 國家規則（每行一條）
      placeholder: |
        DE
        *
        -US
      hint: 使用 ISO 3166-1 alpha-2 國家程式碼。
      syntax: |
        每行格式：[ - ] ISO-3166-alpha-2
        以 # 開頭的行將被視為註釋並忽略。
        使用 * 匹配任意國家。
        國家程式碼匹配時不區分大小寫。
      examples:
        - "DE"
        - "*"
        - "-US"
      exampleDescription: 這段設定遮蔽 DE 和任意國家，但通過最後一條規則允許 US。
      testLabel: 國家程式碼
      testPlaceholder: DE
      testHint: 輸入 ISO 3166-1 alpha-2 國家程式碼。
    regions:
      title: 州 / 省
      label: 地區規則（每行一條）
      placeholder: |
        DE-BE
        *
        -US-CA
      hint: 使用 Cloudflare metadata 中的 COUNTRY-REGION_CODE 格式。
      syntax: |
        每行格式：[ - ] COUNTRY-REGION_CODE
        以 # 開頭的行將被視為註釋並忽略。
        使用 * 匹配任意地區。
        地區值匹配時不區分大小寫。
      examples:
        - "DE-BE"
        - "*"
        - "-US-CA"
      exampleDescription: 這段設定遮蔽 DE-BE 和任意地區，但通過最後一條規則允許 US-CA。
      testLabel: 地區程式碼
      testPlaceholder: US-CA
      testHint: 輸入 metadata 中的 COUNTRY-REGION_CODE 值。
