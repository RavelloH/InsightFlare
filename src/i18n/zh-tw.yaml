  analyticsEngineDisabledDescription: 當前部署已自動停用 Analytics Engine 繫結，因為 Cloudflare
    賬戶尚未啟用 Analytics Engine。請先在 Cloudflare 中啟用 Analytics Engine，然後重新部署
    InsightFlare 以啟用相關分析功能。
  analyticsEngineDisabledHint: 在啟用 Analytics Engine 並重新部署 Worker 前，分析引擎設定不可修改。
  analyticsEngineOpenCloudflare: 開啟 Cloudflare Analytics Engine
  analyticsEngineGuideTitle: 獲取分析引擎設定
  analyticsEngineGuideDescription: 分析引擎需要 Cloudflare 賬號資訊和一個可讀取 Analytics Engine 的 API Token。
  analyticsEngineGuideSteps:
    - 開啟 Cloudflare Dashboard，進入目標賬號並複製 Account ID。
    - 在 Workers & Pages 中啟用 Analytics Engine；Request、Traffic 和 Event
      三個資料集會隨部署自動建立並繫結。
    - 前往 My Profile → API Tokens，建立 Custom token。
    - 為 Token 新增 Account Analytics 讀取許可權，並限制到當前賬號。
    - 儲存後複製 Token，回到這裡填寫 Account ID 和 API Token。
  notificationEmailTitle: 郵件通知
  notificationEmailDescription: 設定系統用於傳送報告、告警和測試郵件的郵件服務。
  notificationEmailGuideTitle: 獲取 Resend 郵件設定
  notificationEmailGuideDescription: 使用 Resend 傳送系統郵件前，需要準備發件域名和 API Key。
  notificationEmailGuideSteps:
    - 開啟 Resend Dashboard，並確認要作為發件人的域名已完成 DNS 驗證。
    - 在 API Keys 頁面建立新的 API Key。
    - 選擇傳送郵件所需的許可權，並複製生成後的 API Key。
    - 回到這裡填寫發件人名稱、發件電子郵件、Reply-To 和 Resend API Key。
    - 儲存後使用測試收件人傳送一封測試郵件，確認投遞鏈路正常。
