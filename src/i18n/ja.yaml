  botAnalyticsEngineDisabledTitle: Analytics Engine が有効ではありません
  botAnalyticsEngineDisabledDescription:
    Cloudflare アカウントで Analytics Engine
    が有効化されていないため、このデプロイでは Analytics Engine バインディングが自動的に無効化されました。Cloudflare で
    Analytics Engine を有効化し、InsightFlare を再デプロイすると関連分析機能が有効になります。
